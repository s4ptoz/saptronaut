<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — SAPTRONAUT</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #e7dfcf;
      --black: #171512;
      --red: #b52824;
      --gray: #514c44;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--paper);
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      cursor: crosshair;
    }
    .wrap { max-width: 520px; }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(64px, 18vw, 140px);
      font-weight: 700;
      line-height: 1;
      color: var(--red);
      letter-spacing: -0.04em;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(24px, 5vw, 36px);
      margin: 8px 0 12px;
    }
    p { color: var(--gray); font-size: 16px; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 26px;
      background: var(--black);
      color: var(--paper);
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background .2s ease;
    }
    a:hover { background: var(--red); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Nyasar di ruang hampa.</h1>
    <p>Halaman yang lu cari nggak ada — atau udah pindah orbit. Balik ke markas aja.</p>
    <a href="/">Kembali ke Home</a>
  </div>
</body>
</html>
